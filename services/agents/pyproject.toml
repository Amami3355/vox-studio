# The agent crew is a self-contained Python project. It is deliberately not a member of the
# pnpm workspace: `pnpm typecheck`, `biome check` and the vitest suites do not see it, and it
# does not see them. The only thing the two halves share is the vox.exe boundary.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vox-crew"
version = "0.1.0"
description = "The Vox Studio agent crew: drives the Agent production interface from a Brief to a narrated preview."
requires-python = ">=3.11"
# JSON Schema shape checks happen before a Run exists, against the draft-2020-12 schemas the
# Production contract publishes. The floor is the version exercised by the crew and the ceiling
# excludes the next major, whose validator and error APIs may change. Exercised on Python 3.14.4.
dependencies = ["jsonschema>=4.26.0,<5"]

[project.optional-dependencies]
# The ADK framework and the model client, landed with the first agent that thinks (the
# planner). Still optional rather than required: only `AdkPlanAuthor` imports it, and it does so
# when one is built rather than at module load, so no ADK install is needed to run the suite and
# every test that does not exercise the live author runs without it. (`jsonschema` above is a
# different matter: it is a hard dependency, imported at package load, and the suite needs it.)
# The constraint below is the
# only place the exercised version is written: its floor is the version the crew has actually
# been run against, because a floor lower than the evidence is a guess published as a
# requirement, and its ceiling excludes the next major because `LlmAgent`, `Runner.run_async`,
# and the injected session interface are the crew's only contacts with the framework and are
# exactly what a major version is free to reshape. Exercised on Python 3.14.4.
agents = ["google-adk>=2.7.1,<3", "google-genai==2.19.0"]
studio = ["fastapi>=0.141.1,<0.142", "uvicorn>=0.52.4,<0.53"]
dev = ["pytest>=8"]

[project.scripts]
vox-crew = "vox_crew.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
