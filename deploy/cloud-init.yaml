#cloud-config
#
# **This file is a template and is never uploaded as it stands.** Its ExecStart line ends in a
# VOX_IMAGE placeholder — written in the shell's brace-substitution form, and deliberately not
# repeated literally in this comment, for the reason at the bottom of this header. Nothing in the
# repository defines that name, and there is no Environment= or EnvironmentFile= in the unit that
# could: systemd expands an undefined substitution to **nothing**, not to an error. Uploaded
# unrendered, this unit would run `docker run` with no image argument, fail, and be restarted every
# ten seconds for ever by Restart=always, on a box reachable only through an IAP tunnel.
#
# `scripts/deploy-cloud-service.sh` stage 5 is what fills it in, with a **digest** read back from
# Artifact Registry rather than the tag that was pushed. The digest is the point: a moving tag under
# Restart=always means a restart weeks later can quietly bring up a different image, with nothing on
# the VM recording that anything changed. That stage refuses to hand on a file with any
# substitution left unresolved, and the check is a literal one — which is why this comment describes
# the placeholder instead of spelling it, since prose that spells it would trip the check on a file
# that had rendered correctly.
#
# The restart mechanism, which ticket 07 owed a decision on rather than an assumption.
#
# `gcloud compute instances create-with-container` is deprecated — the container startup agent that
# deploys a container at VM creation is on its way out — so "the platform owns restart" needed a
# mechanism that is not that flag. This is it: a systemd unit delivered to Container-Optimized OS
# through cloud-init in the `user-data` metadata key, with `Restart=always`. `gcloud compute
# instances create` takes `--metadata-from-file=user-data=deploy/cloud-init.yaml`, which is the
# documented way to hand an instance a file at creation.
#
# **What is verified and what is not.** `--metadata-from-file` is confirmed against the gcloud CLI
# reference. That Container-Optimized OS reads the `user-data` key and runs cloud-init over it is
# the documented COS contract but has **not been executed**. The VM exists and runs COS, and its
# metadata key list is empty — checked 2026-09-03 — so this file has never been applied to it.
# It is documented intent until the conformance run. See ticket 07's "What was built".
#
# One instance. Not a scaling group, not a template with more than one. ADR-0018 decision 8: the
# replay cache is an in-process `Map`, so one container is one cache, and a request captured inside
# the skew window and replayed against a second instance would be accepted because that instance
# has never seen the id. A deployment that scales past one has changed a property of that ADR and
# owes its own decision.

write_files:
  # ── the env file is fetched at every boot, because /etc on COS does not survive one ──────────
  #
  # **Measured on 2026-09-05, on this instance.** `/etc/vox/service.env` was written by hand over
  # the tunnel before the first boot, at mode 0600, verified present. After the restart the
  # directory did not exist at all, and `vox-production.service` crash-looped fifty times in eight
  # minutes on `docker: open /etc/vox/service.env: no such file or directory`. `/etc` on
  # Container-Optimized OS is writable and **stateless** — it is rebuilt at boot. Both
  # `deploy/fetch-service-env.sh` and `deploy/README.md` had named this as the one assumption in
  # the env-file path that would not fail loudly; it failed on the same day instead.
  #
  # So the fetch belongs to boot, not to a deploy. That was already the design's own sentence —
  # *the box fetches its own values* — it simply was not wired into the boot path. The script is
  # carried here rather than copied to the box, base64-encoded so its quoting survives YAML, and
  # the wizard substitutes it from `deploy/fetch-service-env.sh` at render time so there is one
  # copy of it in the repository and not two.
  - path: /etc/vox/fetch-service-env.sh
    permissions: '0700'
    owner: root
    encoding: b64
    content: ${VOX_FETCH_SCRIPT_B64}

  # A oneshot ordered *before* the service, rather than an ExecStartPre on it. Two reasons, and the
  # second is the load-bearing one:
  #
  #   - `Restart=always` with `RestartSec=10` means an ExecStartPre re-runs on every crash cycle,
  #     so a service failing for an unrelated reason would ask Secret Manager for five secrets
  #     every ten seconds, for as long as nobody was looking.
  #   - `RemainAfterExit=yes` plus `Requires=` makes a failed fetch stop the service from starting
  #     at all. That is the fail-closed shape the rest of this deployment already uses: the volume
  #     check refuses to start without its disk, and this refuses to start without its secrets,
  #     rather than starting a container that is missing one and finding out later.
  - path: /etc/systemd/system/vox-service-env.service
    permissions: '0644'
    owner: root
    content: |
      [Unit]
      Description=Fetch Vox production secrets from Secret Manager
      # It talks to the metadata server and to secretmanager.googleapis.com, so it needs the
      # network up — not merely configured.
      Wants=network-online.target
      After=network-online.target
      Before=vox-production.service

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/bin/bash /etc/vox/fetch-service-env.sh

      [Install]
      WantedBy=multi-user.target

  # The disk unit's **filename is the escaped mount path** and is not free to be a friendly name:
  # systemd derives one from the other, and a `.mount` unit whose name does not match its `Where=`
  # simply does not start. `/mnt/disks/vox-runs` escapes to `mnt-disks-vox\x2druns.mount` — the
  # hyphen inside the final segment becomes `\x2d`, because a bare hyphen is the path separator in
  # an escaped unit name. `systemd-escape -p --suffix=mount /mnt/disks/vox-runs` prints it.
  #
  # The mount point itself is ticket 04's: `prepare-disk.sh` formats and mounts `/mnt/disks/vox-runs`
  # and that is what its conformance run measured.
  - path: /etc/systemd/system/mnt-disks-vox\x2druns.mount
    permissions: '0644'
    owner: root
    content: |
      [Unit]
      Description=Vox persistent Run store
      Before=vox-production.service

      [Mount]
      What=/dev/disk/by-id/google-vox-runs
      Where=/mnt/disks/vox-runs
      Type=ext4
      Options=defaults

      [Install]
      WantedBy=multi-user.target

  - path: /etc/systemd/system/vox-production.service
    permissions: '0644'
    owner: root
    content: |
      [Unit]
      Description=Vox trusted Production service
      # `nofail` is deliberately absent from the mount, and this is a hard dependency rather than a
      # `Wants=`: if the disk does not mount, this unit does not start, and the service's own
      # volume check is the second lock rather than the only one.
      Requires=mnt-disks-vox\x2druns.mount
      # The env file is the same kind of dependency as the disk and is declared the same way: a
      # hard `Requires=`, so a fetch that fails keeps this unit from starting instead of letting
      # docker fail on a missing --env-file every ten seconds. That is what happened on the first
      # boot, and the fifty restarts were all the same error.
      Requires=vox-service-env.service
      After=gcr-online.target mnt-disks-vox\x2druns.mount vox-service-env.service

      [Service]
      Environment="HOME=/home/vox"
      ExecStartPre=/usr/bin/docker-credential-gcr configure-docker --registries=europe-west1-docker.pkg.dev
      ExecStartPre=-/usr/bin/docker rm -f vox-production
      # `--network host` with the service bound to 127.0.0.1 keeps the listener on loopback of the
      # VM itself, which is where the SSH tunnel lands. A published port would put it on the
      # container bridge and make the firewall the only thing keeping it private — the mistake
      # `network-host.ts` refuses one layer down by declining to bind 0.0.0.0.
      #
      # The container path is one level up from the `/var/lib/vox/runs` ticket 04 bind-mounted, and
      # that is ticket 07's change rather than an inherited default: `runs/` cannot be the volume
      # root, because `ProductionPayloadSurface` reads every directory under `runsRoot` as a Run and
      # the ledger and calibration must be persistent too. The disk therefore carries `runs/`,
      # `ledger/` and `calibration.json` side by side.
      ExecStart=/usr/bin/docker run --rm --name vox-production \
        --network host \
        --volume /mnt/disks/vox-runs:/var/lib/vox \
        --env-file /etc/vox/service.env \
        ${VOX_IMAGE}
      ExecStop=/usr/bin/docker stop --time=30 vox-production
      # The platform owns restart, which is the whole point of this file.
      Restart=always
      RestartSec=10
      # A render is 178 s; a stop that killed it at systemd's default would truncate a preview
      # mid-write. `docker stop --time=30` and this must both admit the drain.
      TimeoutStopSec=60

      [Install]
      WantedBy=multi-user.target

runcmd:
  - systemctl daemon-reload
  - systemctl enable --now 'mnt-disks-vox\x2druns.mount'
  # Before the service, and separately, so that a failure to reach Secret Manager is reported by
  # the unit that does the reaching rather than as a docker argument error three layers down.
  - systemctl enable --now vox-service-env.service
  - systemctl enable --now vox-production.service
