name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The one check nobody performs by eye: the manifest silently drifting from the
      # registry, after which the agent produces invalid props for no visible reason.
      - name: Catalog is in sync with the registry
        run: pnpm catalog:check

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm check
